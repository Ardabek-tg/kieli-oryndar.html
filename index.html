<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Киелі орындарға виртуалды саяхат</title>
<style>
:root{--bg:#eef4f3;--ink:#10262f;--mute:#4a6069;--tile:#137a7f;--gold:#b7811f;--card:#fff;--line:#c9dad8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a20;--ink:#e6f0ee;--mute:#9db3b3;--tile:#3fb3b5;--gold:#e0a93d;--card:#14262d;--line:#26414a}}
:root[data-theme="dark"]{--bg:#0d1a20;--ink:#e6f0ee;--mute:#9db3b3;--tile:#3fb3b5;--gold:#e0a93d;--card:#14262d;--line:#26414a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 Georgia,"Noto Serif",serif}
header{padding:56px 20px 28px;max-width:760px;margin:auto}
h1{font-size:clamp(2rem,7vw,3.4rem);line-height:1.1;margin:0 0 14px;letter-spacing:-.01em}
header p{color:var(--mute);max-width:56ch;margin:0}
main{max-width:760px;margin:auto;padding:0 20px 64px}
.route{display:flex;gap:0;overflow-x:auto;padding:18px 0 8px;margin-bottom:8px}
.route button{flex:1 0 auto;background:none;border:0;color:var(--mute);font:inherit;font-size:.95rem;padding:10px 14px 14px;cursor:pointer;border-bottom:3px solid var(--line);white-space:nowrap}
.route button[aria-selected="true"]{color:var(--ink);border-color:var(--gold);font-weight:700}
.route button:focus-visible{outline:2px solid var(--tile);outline-offset:2px}
.scene{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card)}
.scene img{display:block;width:100%;height:auto;max-height:440px;object-fit:cover;object-position:center 35%}
.body{padding:22px}
.body h2{margin:0 0 4px;font-size:1.7rem}
.where{color:var(--tile);margin:0 0 14px;font-size:.95rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 18px}.facts div{border-left:3px solid var(--gold);padding-left:10px}.facts dt{font-size:.8rem;color:var(--mute)}.facts dd{margin:0;font-weight:700;font-size:.95rem}
.body p{margin:0 0 12px;max-width:62ch}
.nav{display:flex;justify-content:space-between;margin-top:16px}
.nav button{font:inherit;background:var(--tile);color:#fff;border:0;border-radius:4px;padding:10px 18px;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.nav button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
footer{max-width:760px;margin:auto;padding:0 20px 40px;color:var(--mute);font-size:.9rem}
</style>
</head>
<body>
<header>
<h1>Киелі орындарға виртуалды саяхат</h1>
<p>Қазақстанның қасиетті жерлері арқылы бес аялдамалық маршрут. Аялдаманы таңдап, тарихымен танысыңыз.</p>
</header>
<main>
<div class="route" role="tablist" id="tabs"></div>
<article class="scene" id="scene" aria-live="polite"></article>
<div class="nav"><button id="prev">Алдыңғы аялдама</button><button id="next">Келесі аялдама</button></div>
</main>
<footer>Мәтіндер қысқа шолу ретінде берілген. Толық мәліметті тарихи дереккөздерден тексеріңіз.</footer>
<script>
var S=[
{n:"Қожа Ахмет Ясауи",w:"Түркістан",f:[["Орны","Түркістан қаласы"],["Салынған кезі","XIV ғасырдың соңы"],["Мәртебесі","ЮНЕСКО, 2003 жыл"]],
t:["Қожа Ахмет Ясауи (XII ғасыр) — түркі әлеміндегі атақты сопы, ақын және ойшыл. Ол «Диуани хикмет» жинағының авторы, ал оның ілімін жалғастырғандар «ясауийа» жолы деп аталады. Ясауи өз хикметтерін қарапайым халыққа түсінікті түркі тілінде жазған.","Кесенені Әмір Темірдің бұйрығымен 1389 жылдан бастап салған. Құрылыс толық аяқталмаған, сондықтан үлкен кіреберіс қақпасының (пештақтың) қабырғасында ағаш арқалықтардың ұштары әлі көрінеді. Сіздің суретіңізден де соны байқауға болады.","Ғимараттың ішінде ондаған бөлме бар, олардың ішінде Қазандық залы ерекше аталады. Онда рәсімдерге арналған ірі қола қазан тұр. Кесененің көк күмбезі мен геометриялық өрнекті әйнекті кірпіштері қалаға алыстан көрінеді.","Түркістан халық арасында қазақ даласының рухани орталығы ретінде құрметтеледі. Қазақстаннан ЮНЕСКО тізіміне бірінші болып енген нысан осы кесене болды."]},
{n:"Арыстанбаб",w:"Түркістан облысы, Отырар өңірі",f:[["Орны","Отырар өңірі"],["Кім","Ясауидің ұстазы"],["Ғимарат","Кесене және мешіт кешені"]],
t:["Арыстанбаб — Қожа Ахмет Ясауидің ұстазы ретінде аталатын әулие. Аңыз бойынша, ол Ясауиге рухани аманатты жеткізіп, оны сопылық жолға баулыған.","Қазіргі кесене көп күмбезді, бұрыштарында мұнарасы бар кірпіш ғимарат. Ескі құрылыстың орнында кейінгі кезеңдерде қайта жөндеу жұмыстары жүргізілген.","Арыстанбаб кесенесі Түркістан маңындағы зиярат бағытының міндетті аялдамаларының бірі. Көпшілік зиярат етушілер Ясауи кесенесімен қатар осы жерге де барады.","Кесененің айналасы жазық дала, сондықтан күмбездер мен мұнаралар ашық аспан аясында ерекше көрінеді."]},
{n:"Бекет ата",w:"Маңғыстау облысы",f:[["Орны","Маңғыстау түбегі"],["Тұлға","Бекет Мырзағұлұлы, 1750–1813"],["Ерекшелігі","Жартасқа қашалған мешіт"]],
t:["Бекет Мырзағұлұлы — Маңғыстауда өмір сүрген әйгілі әулие, ұстаз және діни ағартушы. Ол халықты білімге, адалдыққа және имандылыққа шақырған тұлға ретінде есте қалған.","Бекет ата есімімен аталатын мешіт жартастың ішіне қашалып салынған. Суреттегі тас баспалдақ пен қабырғалар зиярат етушілерді жоғарыдағы мешітке апарады.","Маңғыстаудағы жерасты мешіттер мен некрополь кешендері «Қазақстанның қасиетті географиясы» бағдарламасында аталатын маңызды орындардың қатарына жатады.","Бекет атаға жол шөл мен тасты жазық арқылы өтеді. Көп адам бұл сапарды қажылыққа ұқсас рухани жол деп санайды."]},
{n:"Шопан ата",w:"Маңғыстау облысы",f:[["Орны","Маңғыстау түбегі"],["Кім","Малшылардың пірі"],["Кешен","Жерасты мешіті және зират"]],
t:["Шопан ата — халық сенімінде малшылардың, әсіресе қойшылардың қамқоршысы саналатын әулие. «Шопан» сөзі қойшы дегенді білдіреді.","Шопан ата кешені жартастағы жерасты мешіті мен ірі ескі зираттан тұрады. Маңғыстау тау жыныстарының табиғи қуыстары мен тасқа ойылған бөлмелер осы өңірге тән құрылыс түрі.","Суреттегі ақ қақпада қазақ оюы мен ислам жазуы қатар қолданылған. Бұл кешеннің бүгінгі кіреберісі ескі қасиетті жерге жаңадан жасалған.","Маңғыстауға келген зиярат етушілер әдетте Бекет ата, Шопан ата және басқа жерасты мешіттерін бір маршрутпен аралайды."]},
{n:"Айша бибі",w:"Жамбыл облысы, Тараз маңы",f:[["Орны","Айша бибі ауылы, Тараз маңы"],["Кезеңі","XI–XII ғасырлар"],["Материал","Қашалған терракота кірпіш"]],
t:["Айша бибі кесенесі — Тараздан батысқа қарай орналасқан ортағасырлық сәулет ескерткіші. Ол терракота кірпішіне қашалған әдемі өрнектерімен танымал.","Аңыз бойынша, Айша есімді қыз Тараз билеушісі Қарахан үшін ұзақ жол жүрген. Жолда қайтыс болған соң, Қарахан оның құрметіне кесене тұрғызған. Бұл аңыз ауызша айтылады, сондықтан тарихи дерек ретінде емес, халық хикаясы ретінде қабылданады.","Жақын маңда Бабажа хатун кесенесі де бар. Екі ескерткіш те Тараз өңірінің ортағасырлық құрылыс өнерін көрсетеді.","Кесенеге әр түрлі өрнекті кірпіштер қолданылған. Бұл өрнектер аумақтың қолөнерін және көркемдік мәдениетін көрсетеді. Қазақстанда ол махаббат пен адалдықтың символы ретінде де құрметтеледі."]}
];
